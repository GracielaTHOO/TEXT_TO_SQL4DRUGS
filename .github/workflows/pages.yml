name: Tableau de bord (GitHub Pages)

# Publie results/dashboard.html sans relancer l'évaluation : à la main, ou quand le
# tableau de bord change sur main. Le workflow d'évaluation publie aussi après chaque run.
on:
  push:
    branches: [main]
    paths: ["results/dashboard.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparation du site
        run: |
          mkdir -p site
          cp results/dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
