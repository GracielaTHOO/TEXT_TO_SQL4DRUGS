name: Captures de la démo

# Lance l'image Docker de la démo (vraie BDPM, vrai modèle), pose trois questions comme un
# visiteur et enregistre captures d'écran et GIF dans assets/demo/ (scripts/capture_demo.py).
# À la main uniquement : les captures changent quand l'interface ou le modèle changent.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle Ollama embarqué dans l'image"
        default: "qwen2.5-coder:7b"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Construction et démarrage de la démo
        run: |
          python scripts/stage_demo.py --out build/demo
          docker build -t medsql-demo --build-arg MEDSQL_MODEL="${{ inputs.model }}" build/demo
          docker run -d --name demo -p 7860:7860 medsql-demo
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:7860/ > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:7860/ > /dev/null || { docker logs demo; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Navigateur de capture
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium
      - name: Captures
        run: python scripts/capture_demo.py --url http://127.0.0.1:7860 --out assets/demo
      - name: Journaux du conteneur
        if: failure()
        run: docker logs demo || true
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo
          git diff --cached --quiet && exit 0
          git commit -m "docs(demo): captures de la démo avec ${{ inputs.model }}"
          git pull --rebase origin main
          git push
