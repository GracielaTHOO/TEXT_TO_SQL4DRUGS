name: Déploiement Hugging Face Space

on:
  push:
    branches: [main]
    paths: ["src/**", "app/**", "space/**", "results/runs/**", "pyproject.toml"]
  workflow_dispatch:

jobs:
  # Construit l'image du Space et pose une vraie question au modèle embarqué, avec ou sans
  # jeton Hugging Face : une image cassée ne part jamais en production.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Assemblage du Space
        run: python scripts/deploy_space.py --out build/space
      - name: Construction de l'image
        run: docker build -t medsql-space build/space
      - name: Démarrage et question de test
        run: |
          docker run -d --name space -p 7860:7860 medsql-space
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:7860/ > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:7860/ > /dev/null || { docker logs space; exit 1; }
          docker exec space medsql ask "Combien de spécialités sont commercialisées ?"
      - name: Journaux du conteneur
        if: failure()
        run: docker logs space || true

  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'GracielaTHOO/text2sql-medicaments' }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérification du jeton
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::Secret HF_TOKEN absent : déploiement ignoré (voir docs/deploiement.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.token.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Publication
        if: steps.token.outputs.skip != 'true'
        run: |
          pip install huggingface_hub
          python scripts/deploy_space.py --space "$HF_SPACE"
