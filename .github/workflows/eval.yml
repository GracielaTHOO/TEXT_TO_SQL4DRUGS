name: Évaluation des modèles

# Télécharge la BDPM du jour, sert les modèles avec Ollama sur le runner (CPU),
# lance le banc d'évaluation, puis publie les résultats (dépôt + GitHub Pages).
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Modèles Ollama, séparés par des virgules"
        default: "qwen2.5-coder:1.5b,qwen2.5-coder:3b,qwen2.5-coder:7b"
      limit:
        description: "Nombre de questions (vide = toutes)"
        default: ""
      configs:
        description: "Configurations, séparées par des virgules : base, zero-shot, sans-correction, libelles"
        default: "base"
  schedule:
    - cron: "17 3 2 * *" # le 2 de chaque mois, après la mise à jour mensuelle de la BDPM

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MODELS: ${{ inputs.models || 'qwen2.5-coder:1.5b,qwen2.5-coder:3b,qwen2.5-coder:7b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: pip install -e ".[report]"
      - name: Téléchargement de la BDPM et construction de la base
        run: medsql setup
      - name: Profil des données et contrôle des questions
        run: |
          medsql stats
          mkdir -p results && cp data/raw/manifest.json results/bdpm_manifest.json
          medsql profile
          medsql check-questions
      - name: Installation d'Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags && break; sleep 1; done
      - name: Évaluation
        run: |
          LIMIT_OPT=""
          if [ -n "${{ inputs.limit }}" ]; then LIMIT_OPT="--limit ${{ inputs.limit }}"; fi
          status=0
          CONFIGS="${{ inputs.configs || 'base' }}"
          for model in ${MODELS//,/ }; do
            ollama pull "$model"
            for config in ${CONFIGS//,/ }; do
              case "$config" in
                base) flags="" ;;
                zero-shot) flags="--zero-shot" ;;
                sans-correction) flags="--repairs 0" ;;
                libelles) flags="--value-hints" ;;
                *) echo "::error::configuration inconnue : $config"; exit 1 ;;
              esac
              echo "::group::$model · $config"
              # Une configuration en échec n'empêche pas d'évaluer les suivantes.
              medsql eval --model "$model" $flags $LIMIT_OPT || { echo "::warning::échec de $model · $config"; status=1; }
              echo "::endgroup::"
            done
          done
          exit $status
      - name: Tableau de bord et README
        if: always()
        run: medsql report
      - name: Résumé du run
        if: always()
        run: |
          echo "## Résultats" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/RESULTS:START/,/RESULTS:END/p' README.md | sed '1d;$d' >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrement des résultats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md docs
          git diff --cached --quiet && exit 0
          git commit -m "eval: résultats du $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
      - name: Préparation de GitHub Pages
        if: always()
        run: |
          mkdir -p site
          cp results/dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: always()
