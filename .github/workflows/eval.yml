name: Évaluation des modèles

# Télécharge la BDPM du jour, sert chaque modèle avec Ollama sur son propre runner (CPU,
# en parallèle), lance le banc d'évaluation, puis rassemble et publie les résultats
# (dépôt + GitHub Pages).
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Modèles Ollama, séparés par des virgules (un runner par modèle)"
        default: "qwen2.5-coder:1.5b,qwen2.5-coder:3b,qwen2.5-coder:7b"
      limit:
        description: "Nombre de questions (vide = toutes)"
        default: ""
      configs:
        description: "Configurations, séparées par des virgules : base, zero-shot, sans-correction, sans-libelles, exemples-dynamiques, exemples-lexicaux"
        default: "base"
  schedule:
    - cron: "17 3 2 * *" # le 2 de chaque mois, après la mise à jour mensuelle de la BDPM

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eval
  cancel-in-progress: false

env:
  MODELS: ${{ inputs.models || 'qwen2.5-coder:1.5b,qwen2.5-coder:3b,qwen2.5-coder:7b' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - id: models
        run: |
          echo "models=$(jq -cn --arg m "$MODELS" '$m | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    name: évaluation · ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: pip install -e .
      - name: Téléchargement de la BDPM et construction de la base
        run: medsql setup
      - name: Installation d'Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags && break; sleep 1; done
      - name: Évaluation
        # Sous la limite du job : un modèle trop lent reçoit SIGTERM (`timeout`), enregistre un
        # run partiel, et l'envoi des résultats a encore le temps de s'exécuter. Le délai de
        # l'étape n'est qu'un filet : il ne transmet pas le signal à medsql.
        timeout-minutes: 310
        env:
          MODEL: ${{ matrix.model }}
        run: |
          LIMIT_OPT=""
          if [ -n "${{ inputs.limit }}" ]; then LIMIT_OPT="--limit ${{ inputs.limit }}"; fi
          ollama pull "$MODEL"
          status=0
          CONFIGS="${{ inputs.configs || 'base' }}"
          for config in ${CONFIGS//,/ }; do
            case "$config" in
              base) flags="" ;;
              zero-shot) flags="--zero-shot" ;;
              sans-correction) flags="--repairs 0" ;;
              sans-libelles) flags="--no-value-hints" ;;
              exemples-dynamiques) flags="--dynamic-examples --embedder nomic-embed-text"; ollama pull nomic-embed-text ;;
              exemples-lexicaux) flags="--dynamic-examples --embedder lexical" ;;
              *) echo "::error::configuration inconnue : $config"; exit 1 ;;
            esac
            echo "::group::$MODEL · $config"
            # Une configuration en échec n'empêche pas d'évaluer les suivantes.
            timeout --signal=TERM 290m medsql eval --model "$MODEL" $flags $LIMIT_OPT --out new-runs || { echo "::warning::échec de $MODEL · $config"; status=1; }
            echo "::endgroup::"
          done
          exit $status
      - id: slug
        if: always()
        env:
          MODEL: ${{ matrix.model }}
        run: echo "slug=$(echo "$MODEL" | tr -c 'a-zA-Z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-${{ steps.slug.outputs.slug }}
          path: new-runs/*.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: evaluate
    # Toujours : un modèle en échec ou trop lent ne doit pas priver les autres de leur publication.
    if: always()
    uses: ./.github/workflows/publish.yml
    with:
      run_id: ${{ github.run_id }}
