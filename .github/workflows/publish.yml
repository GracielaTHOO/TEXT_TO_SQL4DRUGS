name: Publication des résultats

# Rassemble les runs d'une évaluation (artefacts runs-*), contrôle les questions sur la BDPM du
# jour, met à jour le README et le tableau de bord, puis publie (dépôt + GitHub Pages).
# Appelé à la fin de « Évaluation des modèles » ; lançable à la main pour republier les
# artefacts d'une évaluation passée (conservés 7 jours).
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identifiant du run d'évaluation dont publier les artefacts"
        required: true

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: pip install -e ".[report]"
      - name: Téléchargement de la BDPM et construction de la base
        run: medsql setup
      - name: Profil des données et contrôle des questions
        run: |
          medsql stats
          mkdir -p results && cp data/raw/manifest.json results/bdpm_manifest.json
          medsql profile
          medsql check-questions
      - name: Rassemblement des runs
        uses: actions/download-artifact@v4
        with:
          pattern: runs-*
          path: results/runs
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Tableau de bord et README
        run: medsql report
      - name: Résumé
        run: |
          echo "## Résultats" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/RESULTS:START/,/RESULTS:END/p' README.md | sed '1d;$d' >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrement des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md docs
          git diff --cached --quiet && exit 0
          git commit -m "eval: résultats du $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
      - name: Préparation de GitHub Pages
        run: |
          mkdir -p site
          cp results/dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
