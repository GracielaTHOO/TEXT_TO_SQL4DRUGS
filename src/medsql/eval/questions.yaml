- id: q021
  question: Quels sont les génériques du DOLIPRANE 1000 mg ?
  sql: |
    SELECT DISTINCT m.denomination
    FROM groupes_generiques g
    JOIN groupes_generiques p ON p.id_groupe = g.id_groupe AND p.type_generique = 0
    JOIN medicaments mp ON mp.cis = p.cis
    JOIN medicaments m ON m.cis = g.cis
    WHERE g.type_generique <> 0
      AND sans_accents(mp.denomination) LIKE 'DOLIPRANE 1000 MG%'
  difficulte: difficile
  categorie: generiques

