# Jeu d'évaluation Text-to-SQL — BDPM
#
# Chaque entrée associe une question en français à une requête SQL de référence (« gold »).
# La réponse attendue n'est PAS figée : elle est recalculée en exécutant la requête gold sur
# la base du jour, ce qui garde le jeu valide à chaque mise à jour mensuelle de la BDPM.
#
# Champs :
#   id          identifiant stable (q001…)
#   question    formulation naturelle, comme un utilisateur la poserait
#   sql         requête de référence (colonnes minimales : la métrique accepte des colonnes en plus)
#   difficulte  facile | moyen | difficile
#   categorie   comptage | filtrage | jointure | agregation | classement | dates | prix |
#               generiques | has | disponibilite
#   ordonne     true si l'ordre des lignes fait partie de la réponse (classements)
#
# Règle : aucune question ne doit reprendre un exemple few-shot du prompt (test automatisé).

- id: q001
  question: Combien de spécialités pharmaceutiques sont recensées dans la base ?
  sql: SELECT COUNT(*) FROM medicaments
  difficulte: facile
  categorie: comptage

- id: q002
  question: Combien de médicaments sont actuellement commercialisés ?
  sql: SELECT COUNT(*) FROM medicaments WHERE etat_commercialisation = 'Commercialisée'
  difficulte: facile
  categorie: comptage

- id: q003
  question: Combien de médicaments font l'objet d'une surveillance renforcée ?
  sql: SELECT COUNT(*) FROM medicaments WHERE surveillance_renforcee = 1
