- id: q010
  question: Quels sont les 5 laboratoires titulaires du plus grand nombre de spécialités ?
  sql: |
    SELECT titulaires FROM medicaments
    GROUP BY titulaires ORDER BY COUNT(*) DESC LIMIT 5
  difficulte: moyen
  categorie: classement
  ordonne: true

- id: q011
  question: Quel est le prix de la boîte de DOLIPRANE 1000 mg la moins chère ?
  sql: |
    SELECT MIN(p.prix_euros) FROM presentations p
    JOIN medicaments m ON m.cis = p.cis
    WHERE sans_accents(m.denomination) LIKE 'DOLIPRANE 1000 MG%'
  difficulte: moyen
  categorie: prix

