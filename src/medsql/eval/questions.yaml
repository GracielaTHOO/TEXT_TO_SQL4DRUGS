- id: q007
  question: Combien de spécialités différentes contiennent du paracétamol comme substance active ?
  sql: |
    SELECT COUNT(DISTINCT cis) FROM compositions
    WHERE nature_composant = 'SA' AND sans_accents(substance) LIKE '%PARACETAMOL%'
  difficulte: moyen
  categorie: jointure

- id: q008
  question: Quels médicaments s'administrent par voie cutanée ?
  sql: |
    SELECT m.denomination FROM medicaments m
    JOIN medicament_voies v ON v.cis = m.cis
    WHERE v.voie = 'cutanée'
  difficulte: moyen
  categorie: jointure

- id: q009
  question: Combien de spécialités s'administrent par voie intraveineuse ?
