[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "medsql"
version = "0.2.0"
description = "Text-to-SQL en français sur la Base de données publique des médicaments (BDPM), avec un LLM local et un banc d'évaluation reproductible."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Graciela THOO" }]
requires-python = ">=3.10"
keywords = ["text-to-sql", "llm", "ollama", "sqlite", "open-data", "medicaments", "bdpm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: French",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "sqlglot>=25.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
app = ["gradio>=4.40", "pandas>=2.0", "plotly>=5.20"]
report = ["plotly>=5.20"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
medsql = "medsql.cli:app"

[project.urls]
Homepage = "https://github.com/GracielaTHOO/TEXT_TO_SQL4DRUGS"
Documentation = "https://github.com/GracielaTHOO/TEXT_TO_SQL4DRUGS/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/medsql"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PL"]
# E501 : la longueur des lignes est gérée par `ruff format` ; seules les chaînes longues dépassent.
ignore = ["E501", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
# Imports différés : la CLI démarre instantanément sans charger httpx, sqlglot, etc.
"src/medsql/cli.py" = ["PLC0415", "PLR0917"]
"app/**" = ["PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/medsql"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["ollama: tests nécessitant un serveur Ollama local (désactivés par défaut)"]

[tool.coverage.run]
source = ["medsql"]
branch = true
